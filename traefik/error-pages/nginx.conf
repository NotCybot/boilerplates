server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Fehlerseiten, die Traefik anfragt: /404.html, /500.html, ...
    location ~ "^/[45][0-9]{2}\.html$" {
        try_files $uri /404.html;
    }
    # alles andere -> 404 (fängt der Catch-all-Router ab)
    location / {
        return 404;
    }
}