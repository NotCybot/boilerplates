  middlewares:
#    addbotprefix:
#      addPrefix:
#       prefix: "/quizmod"
    addprefix-pihole:
      addPrefix:
        prefix: "/admin"
    https-redirectscheme:
      redirectScheme:
        scheme: https
        permanent: true

    error-pages:
      errors:
        status:
          - "400-599"
        service: error-pages
        query: "/{status}.html"

    authentik:
        forwardAuth:
            address: http://authentik-ms-1:9000/outpost.goauthentik.io/auth/traefik
            trustForwardHeader: true
            authResponseHeaders:
                - X-authentik-username
                - X-authentik-groups
                - X-authentik-entitlements
                - X-authentik-email
                - X-authentik-name
                - X-authentik-uid
                - X-authentik-jwt
                - X-authentik-meta-jwks
                - X-authentik-meta-outpost
                - X-authentik-meta-provider
                - X-authentik-meta-app
                - X-authentik-meta-version

          
#    authentik:
#      forwardauth:
#        address: "http://auth.pve01.local.example.com/outpost.goauthentik.io/auth/traefik"
#       trustForwardHeader: true
#       authResponseHeaders:
#         - X-authentik-username
#         - X-authentik-groups
#         - X-authentik-email
#         - X-authentik-name
#         - X-authentik-uid
#         - X-authentik-jwt
#         - X-authentik-meta-jwks
#         - X-authentik-meta-outpost
#         - X-authentik-meta-provider
#         - X-authentik-meta-app
#         - X-authentik-meta-version

    default-headers:
      headers:
        contentTypeNosniff: true
        customFrameOptionsValue: SAMEORIGIN
        # Modern equivalent of X-Frame-Options. Only frame-ancestors, so no app breaks.
        contentSecurityPolicy: "frame-ancestors 'self'"
        referrerPolicy: strict-origin-when-cross-origin
        # X-XSS-Protection: 0 — the legacy filter is removed from current browsers
        # and used to introduce XSS itself. OWASP recommends disabling it explicitly.
        customBrowserXSSValue: "0"
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 31536000
        customRequestHeaders:
          X-Forwarded-Proto: https
        # An empty value removes the header instead of setting it.
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""

    lan-only:
      ipAllowList:
        sourceRange:
        - "10.0.0.0/8"
        - "192.168.0.0/16"
        - "172.16.0.0/12"

    secured:
      chain:
        middlewares:
        - lan-only
        - default-headers
        - https-redirectscheme
        - cloudflarewarp
#       - crowdsec-bouncer

    crowdsec-bouncer:
      forwardauth:
        address: http://bouncer-traefik:8080/api/v1/forwardAuth
        trustForwardHeader: true

    cloudflarewarp:
        plugin:
            cloudflarewarp:
                disableDefault: "false"
                trustip:
                    - 2400:cb00::/32

  serversTransports:
    # Proxmox serves a self-signed certificate. Scoped here instead of globally.
    pve01-insecure:
      insecureSkipVerify: true

tls:
  options:
    default:
      minVersion: VersionTLS12
      # Reject handshakes without a matching certificate (IP scans, unknown hosts).
      sniStrict: true
