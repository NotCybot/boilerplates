tcp:
  routers:
    wazuh-agent:
      entryPoints:
        - wazuh-agent
      rule: "HostSNI(`*`)"
      middlewares:
        - lan-only
      service: wazuh-agent
    wazuh-enroll:
      entryPoints:
        - wazuh-enroll
      rule: "HostSNI(`*`)"
      middlewares:
        - lan-only
      service: wazuh-enroll

  middlewares:
    lan-only:
      ipAllowList:
        sourceRange:
          - "10.0.0.0/8"
          - "192.168.0.0/16"
          - "172.16.0.0/12"

  services:
    wazuh-agent:
      loadBalancer:
        servers:
          - address: "192.0.2.29:1514"
    wazuh-enroll:
      loadBalancer:
        servers:
          - address: "192.0.2.29:1515"

