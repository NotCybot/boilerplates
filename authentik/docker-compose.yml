services:
  # Alte Stack-Datenbank, seit dem Umzug auf pg01 stillgelegt: Portainer kennt
  # kein --profile, ein Service mit profiles startet dort also nicht. Service und
  # Volume bleiben als Rollback-Pfad, bis ein Restore von pg01 geprueft ist.
  postgresql:
    profiles:
      - legacy
    container_name: authentik-pg-ms-1
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_USER: ${PG_USER}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    image: docker.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    volumes:
    - database:/var/lib/postgresql/data
    networks:
    - internal
  server:
    command: server
    container_name: authentik-ms-1
    environment:
      - AUTHENTIK_EMAIL__HOST=${AUTHENTIK_EMAIL__HOST:?error}
      - AUTHENTIK_EMAIL__PORT=${AUTHENTIK_EMAIL__PORT:-25}
      - AUTHENTIK_EMAIL__USERNAME=${AUTHENTIK_EMAIL__USERNAME:?error}
      - AUTHENTIK_EMAIL__PASSWORD=${AUTHENTIK_EMAIL__PASSWORD:?error}
      - AUTHENTIK_EMAIL__USE_TLS=${AUTHENTIK_EMAIL__USE_TLS:-false}
      - AUTHENTIK_EMAIL__USE_SSL=${AUTHENTIK_EMAIL__USE_SSL:-false}
      - AUTHENTIK_EMAIL__TIMEOUT=${AUTHENTIK_EMAIL__TIMEOUT:-10}
      - AUTHENTIK_EMAIL__FROM=${AUTHENTIK_EMAIL__FROM:?error}
      # Zentrale Postgres auf pg01, nicht mehr der postgresql-Service hier.
      # sslmode=require: pg01 laesst nur hostssl zu. authentik verlangt fuer TLS
      # TLS 1.3 oder Extended Master Secret, PG 17 mit OpenSSL 3 erfuellt das.
      - AUTHENTIK_POSTGRESQL__HOST=${DB_HOST:-192.0.2.10}
      - AUTHENTIK_POSTGRESQL__NAME=${PG_DB:-authentik}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${PG_PASS:?missing}
      - AUTHENTIK_POSTGRESQL__USER=${PG_USER:-authentik}
      - AUTHENTIK_POSTGRESQL__SSLMODE=require
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
    image: ghcr.io/goauthentik/server:2026.8.1@sha256:9d605ed569ff9f39146be39da93714b2acf19072acc4ab0f0e2f2d81be88cdce
    #ports:
      # (Optional)  Remove these, if you're using a reverse proxy like Traefik.
    #  - 1000:9000
    #  - 1443:9443
    labels:
      # (Optional)  Enable Traefik integration for the Authentik Web UI. For more information
      #             about integrating other services with Traefik and Authentik, see the
      #             documentation at https://goauthentik.io/docs/outposts/integrations/traefik
      #             and the middleware example files in `docker-compose/traefik/config`.
      - traefik.enable=true

      - traefik.http.routers.authentik-ms-1.rule=Host(`auth.pve01.local.example.com`)
      - traefik.http.routers.authentik-ms-1.entrypoints=https
      - traefik.http.routers.authentik-ms-1.tls=true
      - traefik.http.routers.authentik-ms-1.tls.certresolver=cloudflare
      - traefik.http.routers.authentik-ms-1.service=authentik-ms-1

      - traefik.http.services.authentik-ms-1.loadbalancer.server.port=9000
      - traefik.http.services.authentik-ms-1.loadbalancer.server.scheme=http
      - traefik.docker.network=proxy
    restart: unless-stopped
    volumes:
    - ./data:/data
    - ./custom-templates:/templates
    networks:
    - internal
    - proxy
  worker:
    command: worker
    container_name: authentik-worker-ms-1
    environment:
      - AUTHENTIK_DOCKER__URL=http://authentik-socket-proxy-ms-1:2375
      # Stand vorher auf dem Containernamen, jetzt dieselbe Quelle wie server.
      - AUTHENTIK_POSTGRESQL__HOST=${DB_HOST:-192.0.2.10}
      - AUTHENTIK_POSTGRESQL__USER=${PG_USER:-authentik}
      - AUTHENTIK_POSTGRESQL__NAME=${PG_DB:-authentik}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${PG_PASS:?missing}
      - AUTHENTIK_POSTGRESQL__SSLMODE=require
      # (Required)  To generate a secret key run the following command:
      #             echo $(openssl rand -base64 32)
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY:?error}
      # (Optional)  Enable Error Reporting
      - AUTHENTIK_ERROR_REPORTING__ENABLED=${AUTHENTIK_ERROR_REPORTING:-false}
      # (Optional)  Enable Email Sending
      #             Highly recommended to notify you about alerts and configuration issues.
      - AUTHENTIK_EMAIL__HOST=${AUTHENTIK_EMAIL__HOST:?error}
      - AUTHENTIK_EMAIL__PORT=${AUTHENTIK_EMAIL__PORT:-25}
      - AUTHENTIK_EMAIL__USERNAME=${AUTHENTIK_EMAIL__USERNAME:?error}
      - AUTHENTIK_EMAIL__PASSWORD=${AUTHENTIK_EMAIL__PASSWORD:?error}
      - AUTHENTIK_EMAIL__USE_TLS=${AUTHENTIK_EMAIL__USE_TLS:-false}
      - AUTHENTIK_EMAIL__USE_SSL=${AUTHENTIK_EMAIL__USE_SSL:-false}
      - AUTHENTIK_EMAIL__TIMEOUT=${AUTHENTIK_EMAIL__TIMEOUT:-10}
      - AUTHENTIK_EMAIL__FROM=${AUTHENTIK_EMAIL__FROM:?error}
    # (Optional)  See more for the docker socket integration here:
    #             https://goauthentik.io/docs/outposts/integrations/docker
    image: ghcr.io/goauthentik/server:2026.8.1@sha256:9d605ed569ff9f39146be39da93714b2acf19072acc4ab0f0e2f2d81be88cdce
    restart: unless-stopped
    user: root
    volumes:
    - ./data:/data
    - ./certs:/certs
    - ./custom-templates:/templates
    networks:
    - internal
    - outbound

  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.4@sha256:ba211325155c463a1a6e6a038c928f21447a8e60ce02ecf41302047974097e84
    container_name: authentik-socket-proxy-ms-1
    environment:
      - ALLOW_START=0 #optional
      - ALLOW_STOP=0 #optional
      - ALLOW_RESTARTS=0 #optional
      - AUTH=0 #optional
      - BUILD=0 #optional
      - COMMIT=0 #optional
      - CONFIGS=0 #optional
      - CONTAINERS=1 #optional
      - DISABLE_IPV6=0 #optional
      - DISTRIBUTION=0 #optional
      - EVENTS=1 #optional
      - EXEC=0 #optional
      - IMAGES=1 #optional
      - INFO=0 #optional
      - LOG_LEVEL=info #optional
      - NETWORKS=0 #optional
      - NODES=0 #optional
      - PING=1 #optional
      - PLUGINS=0 #optional
      - POST=0 #optional
      - SECRETS=0 #optional
      - SERVICES=0 #optional
      - SESSION=0 #optional
      - SWARM=0 #optional
      - SYSTEM=1 #optional
      - TASKS=0 #optional
      - TZ=Etc/UTC #optional
      - VERSION=1 #optional
      - VOLUMES=0 #optional
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    networks:
      - internal

volumes:
  database:
    driver: local

networks:
  proxy:
    external: true
  internal:
    internal: true
  outbound:
    driver: bridge