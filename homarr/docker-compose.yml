services:
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:v2.4.0@sha256:b65975397d0900914d4147764ff4979a164ccb2b61bb93515983f8bdcafd3413
    restart: unless-stopped
    networks: 
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Optional, only if you want docker integration
      - /etc/dockercompose/homarr/appdata:/appdata
    environment:
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
      - BASE_URL=${HOMARR_FQDN}
      - NEXTAUTH_URL=${HOMARR_FQDN}
      - AUTH_PROVIDERS=oidc,credentials
      - AUTH_OIDC_CLIENT_ID=${AUTH_OIDC_CLIENT_ID}
      - AUTH_OIDC_CLIENT_SECRET=${AUTH_OIDC_CLIENT_SECRET}
      - AUTH_OIDC_SCOPE_OVERWRITE=openid email profile groups
      - AUTH_OIDC_GROUPS_ATTRIBUTE=groups
      - AUTH_LOGOUT_REDIRECT_URL=${AUTH_LOGOUT_REDIRECT_URL}
      - AUTH_OIDC_ISSUER=${AUTH_OIDC_ISSUER}
      - AUTH_OIDC_URI=${AUTH_OIDC_URI}
      - AUTH_OIDC_CLIENT_NAME=authentik
      - AUTH_OIDC_AUTO_LOGIN=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homarr.entrypoints=https"
      - "traefik.http.routers.homarr.rule=Host(`homarr.pve01.local.example.com`)"
      - "traefik.http.routers.homarr.tls=true"
      - "traefik.http.routers.homarr.tls.certresolver=cloudflare"
      - "traefik.http.routers.homarr.service=homarr"
      - "traefik.http.services.homarr.loadbalancer.server.port=7575"
      - "traefik.docker.network=proxy"

networks: 
  proxy:
    external: true
