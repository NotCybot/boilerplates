---
version: "2.1"
services:
  adguardhome-sync:
    image: quay.io/bakito/adguardhome-sync:v0.9.4@sha256:4fec72b9c580c6711036ea42db645232d86384fde687365b0d0452d38d507280
    container_name: adguardhome-sync
    command: run
    environment:
      - ORIGIN_URL=${ORIGIN_URL}
      - ORIGIN_USERNAME=${ORIGIN_USERNAME} 
      - ORIGIN_PASSWORD=${ORIGIN_PASSWORD} 
      - REPLICA_URL=${REPLICA_URL}
      - REPLICA_USERNAME=${REPLICA_USERNAME} 
      - REPLICA_PASSWORD=${REPLICA_PASSWORD}
      - CRON=*/1 * * * * # run every 1 minute
      - RUNONSTART=true

      - FEATURES_GENERAL_SETTINGS=true
      - FEATURES_DNS_REWRITES=true
      - FEATURES_FILTERS=true
      
    #ports:
    #  - 8080:8080 
    restart: unless-stopped