# ===========================================================================
# Sure – Docker Compose für Portainer Stacks + Traefik
# ===========================================================================
#
# Deployment:
#   Stacks -> Add stack -> Web editor -> diese Datei einfügen
#   Environment variables -> Advanced mode -> .env-Inhalt einfügen (ohne "")
#
# WICHTIG: kein env_file – Portainer schreibt keine .env ins Stack-Verzeichnis.
# Ingress: über Traefik im externen Netz "proxy". Kein Port-Publishing nötig.
# IPv6: deaktiviert. DNS: auskommentiert (Host-Resolver wird genutzt).
#

x-db-env: &db_env
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
  POSTGRES_DB: ${POSTGRES_DB:-sure}

x-rails-env: &rails_env
  <<: *db_env

  SKYLIGHT_ENABLED: ${SKYLIGHT_ENABLED:-false}

  # --- Kern ---------------------------------------------------------------
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE fehlt – openssl rand -hex 64}
  SELF_HOSTED: "true"
  # Traefik terminiert TLS und spricht per HTTP mit dem Container:
  # ASSUME_SSL sagt Rails, dass die Verbindung außen trotzdem HTTPS ist.
  RAILS_ASSUME_SSL: ${RAILS_ASSUME_SSL:-true}
  RAILS_FORCE_SSL: ${RAILS_FORCE_SSL:-true}
  # Zentrale Postgres auf pg01, nicht mehr der db-Service dieses Stacks.
  DB_HOST: ${DB_HOST:-192.0.2.10}
  DB_PORT: ${DB_PORT:-5432}
  # libpq liest PGSSLMODE, Rails braucht dafür keine eigene Option. pg01 hat ein
  # selbstsigniertes Zertifikat, require verschlüsselt ohne Namensprüfung.
  PGSSLMODE: ${PGSSLMODE:-require}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD fehlt}@redis:6379/1

  # --- Verschlüsselung sensibler Felder (API-Keys, Bank-Tokens, MFA, PII) ---
  # ACHTUNG: Diese Keys NIE ändern oder verlieren – sonst sind alle damit
  # verschlüsselten Daten unwiederbringlich weg. Getrennt vom DB-Backup sichern.
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:-}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-}

  # --- App ----------------------------------------------------------------
  APP_DOMAIN: ${APP_DOMAIN:-sure.example.com}
  ONBOARDING_STATE: ${ONBOARDING_STATE:-open}   # nach erstem Account -> closed
  PRODUCT_NAME: ${PRODUCT_NAME:-}
  BRAND_NAME: ${BRAND_NAME:-}

  # --- OIDC / Authentik ---------------------------------------------------
  # AUTH_PROVIDERS_SOURCE: ${AUTH_PROVIDERS_SOURCE:-}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}

  # --- Login-Policy -------------------------------------------------------
  # Reihenfolge: erst lokalen Admin anlegen + einmal per SSO einloggen,
  # DANN AUTH_LOCAL_LOGIN_ENABLED auf false. Sonst sperrst du dich aus.
  AUTH_LOCAL_LOGIN_ENABLED: ${AUTH_LOCAL_LOGIN_ENABLED:-true}
  AUTH_LOCAL_ADMIN_OVERRIDE_ENABLED: ${AUTH_LOCAL_ADMIN_OVERRIDE_ENABLED:-true}
  AUTH_JIT_MODE: ${AUTH_JIT_MODE:-create_and_link}
  ALLOWED_OIDC_DOMAINS: ${ALLOWED_OIDC_DOMAINS:-}

  # --- WebAuthn / Passkeys ------------------------------------------------
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-example.com}
  WEBAUTHN_ALLOWED_ORIGINS: ${WEBAUTHN_ALLOWED_ORIGINS:-https://sure.example.com}

  # --- Kursdaten ----------------------------------------------------------
  SECURITIES_PROVIDER: ${SECURITIES_PROVIDER:-yahoo_finance}
  EXCHANGE_RATE_PROVIDER: ${EXCHANGE_RATE_PROVIDER:-yahoo_finance}
  TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}

  # --- SMTP ---------------------------------------------------------------
  SMTP_ADDRESS: ${SMTP_ADDRESS:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_DOMAIN: ${SMTP_DOMAIN:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-plain}
  SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-true}
  EMAIL_SENDER: ${EMAIL_SENDER:-}

  # --- TLS ----------------------------------------------------------------
  SSL_VERIFY: ${SSL_VERIFY:-true}
  # SSL_CA_FILE: ${SSL_CA_FILE:-}

  # NOTE: OpenAI verursacht Kosten bei Nutzung der AI-Features.
  OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN:-}

services:
  web:
    image: ghcr.io/we-promise/sure:0.7.5@sha256:46c0cedf89cf5c801f91ced894d1d1e6e401b6352fe1b5b4ba242f9b192a5807
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    volumes:
      - app-storage:/rails/storage
      # CA-Bundle für internes Authentik-Zertifikat (absoluter Hostpfad):
      # - /opt/sure/ca-bundle.pem:/opt/sure/ca-bundle.pem:ro
    # Kein ports:-Block mehr – Traefik erreicht den Container direkt über das
    # proxy-Netz. Nur für Debugging ohne Proxy entkommentieren:
    # ports:
    #   - 127.0.0.1:${PORT:-3000}:3000
    restart: unless-stopped
    environment:
      <<: *rails_env
    labels:
      - traefik.enable=true

      - traefik.http.routers.sure.rule=Host(`sure.example.com`)
      - traefik.http.routers.sure.entrypoints=https
      - traefik.http.routers.sure.tls=true
      - traefik.http.routers.sure.tls.certresolver=cloudflare
      - traefik.http.routers.sure.service=sure

      - traefik.http.services.sure.loadbalancer.server.port=3000
      - traefik.http.services.sure.loadbalancer.server.scheme=http

      # Pflicht, weil der Container in zwei Netzen hängt – ohne diese Zeile
      # rät Traefik die IP und trifft ggf. sure_net statt proxy.
      - traefik.docker.network=proxy

      # (Optional) Security-Header. Middleware muss in deiner Traefik-Config
      # existieren, sonst antwortet der Router mit 500.
      # - traefik.http.routers.sure.middlewares=default-headers@file
    security_opt:
      - no-new-privileges:true
    # dns:
    #   - 192.0.2.26
    #   - 192.0.2.27
    # Falls der Container auth.example.com nicht auflöst:
    # extra_hosts:
    #   - "auth.example.com:192.0.2.21"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sure_net
      - proxy

  worker:
    image: ghcr.io/we-promise/sure:0.7.5@sha256:46c0cedf89cf5c801f91ced894d1d1e6e401b6352fe1b5b4ba242f9b192a5807
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    command: bundle exec sidekiq
    volumes:
      - app-storage:/rails/storage
      # - /opt/sure/ca-bundle.pem:/opt/sure/ca-bundle.pem:ro
    restart: unless-stopped
    environment:
      <<: *rails_env
    labels:
      # Kein HTTP-Endpunkt – explizit für Traefik unsichtbar halten
      - traefik.enable=false
    security_opt:
      - no-new-privileges:true
    # dns:
    #   - 192.0.2.26
    #   - 192.0.2.27
    # Fallback gegen Yahoo-Finance-Timeouts, IPs können veralten:
    # extra_hosts:
    #   - "fc.yahoo.com:173.223.12.81"
    #   - "query1.finance.yahoo.com:98.136.48.169"
    #   - "query2.finance.yahoo.com:98.136.48.169"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sure_net

  # Alte Stack-Datenbank. Seit dem Umzug auf pg01 stillgelegt: Portainer kennt
  # kein --profile, ein Service mit profiles startet dort also nicht. Service und
  # Volume bleiben als Rollback-Pfad, bis ein Restore von pg01 geprüft ist.
  db:
    profiles:
      - legacy
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      <<: *db_env
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    labels:
      - traefik.enable=false
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure_net

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    mem_limit: 256m
    pids_limit: 128
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD fehlt}
      --appendonly yes
    restart: unless-stopped
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    labels:
      - traefik.enable=false
    security_opt:
      - no-new-privileges:true
    # Start as the redis user of the image. As root the entrypoint walks /data
    # to fix ownership, which fails on the 0700 appendonlydir without DAC_OVERRIDE.
    user: "999:1000"
    cap_drop:
      - ALL
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure_net

  # Portainer kennt kein --profile. Zum Aktivieren die beiden profiles-Zeilen
  # löschen und den Stack neu deployen.
  # Seit dem Umzug sichert pg01 zentral (03:00, 14 Tage). Dieser Sidecar bleibt
  # nur als Notfall-Dump und ist per profiles inaktiv.
  backup:
    profiles:
      - backup
    image: prodrigestivill/postgres-backup-local:16-alpine@sha256:08e7b70879af45a89305b91f4600cfbc88da2419a65948df870cddb082b8cf83
    restart: unless-stopped
    volumes:
      - ${BACKUP_PATH:-/opt/sure-data/backups}:/backups
    environment:
      POSTGRES_HOST: ${DB_HOST:-192.0.2.10}
      POSTGRES_DB: ${POSTGRES_DB:-sure}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # pipelock:ignore
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
    labels:
      - traefik.enable=false
    security_opt:
      - no-new-privileges:true
    networks:
      - sure_net

volumes:
  app-storage:
  # Bleibt bis der Umzug abgenommen ist, siehe db-Service.
  postgres-data:
  redis-data:

networks:
  sure_net:
    driver: bridge
    enable_ipv6: false
  # Bestehendes Traefik-Netz – wird nicht vom Stack angelegt.
  # Falls es bei dir anders heißt: hier und in traefik.docker.network anpassen.
  proxy:
    external: true