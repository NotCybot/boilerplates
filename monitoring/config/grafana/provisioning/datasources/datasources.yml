apiVersion: 1

# Prometheus is deliberately absent. Grafana already has prometheus-ms and
# prometheus-pi, both maintained by hand. Provisioning a third would add a
# stray entry and steal the default, and provisioning over either of them by
# name would rewrite its uid and break every dashboard pointing at the old
# one. The dashboards pick their Prometheus through a datasource variable
# instead, which is what lets one dashboard serve both hosts.
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    isDefault: false
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
