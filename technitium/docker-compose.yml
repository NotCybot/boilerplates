services:
  dns-server:
    container_name: dns-server
    hostname: dns-server
    networks: 
      - proxy
    image: docker.io/technitium/dns-server:15.6.0@sha256:1045db38fd2f2e4d9578f9168b7eb4862575469ed0ffc79e03f36bdc772a93b5
    security_opt:
      - no-new-privileges:true
    # Runs as root, but needs no capability beyond binding port 53.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 4g
    pids_limit: 512
    # For DHCP deployments, use "host" network mode and remove all the port mappings, including the ports array by commenting them
    # network_mode: "host"
    ports:
      - "5380:5380/tcp" #DNS web console (HTTP)
      - "53443:53443/tcp" #DNS web console (HTTPS)
      - "53:53/udp" #DNS service
      - "53:53/tcp" #DNS service
      - "853:853/udp" #DNS-over-QUIC service
      - "853:853/tcp" #DNS-over-TLS service
      # - "443:443/udp" #DNS-over-HTTPS service (HTTP/3)
      # - "443:443/tcp" #DNS-over-HTTPS service (HTTP/1.1, HTTP/2)
      # - "80:80/tcp" #DNS-over-HTTP service (use with reverse proxy or certbot certificate renewal)
      # - "8053:8053/tcp" #DNS-over-HTTP service (use with reverse proxy)
      # - "67:67/udp" #DHCP service
    environment:
      - DNS_SERVER_DOMAIN=dns-server #The primary domain name used by this DNS Server to identify itself.
      # - DNS_SERVER_ADMIN_PASSWORD=password #DNS web console admin user password.
      # - DNS_SERVER_ADMIN_PASSWORD_FILE=password.txt #The path to a file that contains a plain text password for the DNS web console admin user.
      # - DNS_SERVER_PREFER_IPV6=false #DNS Server will use IPv6 for querying whenever possible with this option enabled.
      # - DNS_SERVER_WEB_SERVICE_LOCAL_ADDRESSES=172.17.0.1,127.0.0.1 #Comma separated list of network interface IP addresses that you want the web service to listen on for requests. The "172.17.0.1" address is the built-in Docker bridge. The "[::]" is the default value if not specified. Note! This must be used only with "host" network mode.
      # - DNS_SERVER_WEB_SERVICE_HTTP_PORT=5380 #The TCP port number for the DNS web console over HTTP protocol.
      # - DNS_SERVER_WEB_SERVICE_HTTPS_PORT=53443 #The TCP port number for the DNS web console over HTTPS protocol.
      # - DNS_SERVER_WEB_SERVICE_ENABLE_HTTPS=false #Enables HTTPS for the DNS web console.
      # - DNS_SERVER_WEB_SERVICE_USE_SELF_SIGNED_CERT=false #Enables self signed TLS certificate for the DNS web console.
      # - DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PATH=/etc/dns/tls/cert.pfx #The file path to the TLS certificate for the DNS web console.
      # - DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PASSWORD=password #The password for the TLS certificate for the DNS web console.
      # - DNS_SERVER_WEB_SERVICE_HTTP_TO_TLS_REDIRECT=false #Enables HTTP to HTTPS redirection for the DNS web console.
      # - DNS_SERVER_OPTIONAL_PROTOCOL_DNS_OVER_HTTP=false #Enables DNS server optional protocol DNS-over-HTTP on TCP port 8053 to be used with a TLS terminating reverse proxy like nginx.
      # - DNS_SERVER_RECURSION=AllowOnlyForPrivateNetworks #Recursion options: Allow, Deny, AllowOnlyForPrivateNetworks, UseSpecifiedNetworkACL.
      # - DNS_SERVER_RECURSION_NETWORK_ACL=192.168.10.0/24, !192.0.2.28 #Comma separated list of IP addresses or network addresses to allow access. Add ! character at the start to deny access, e.g. !192.168.10.0/24 will deny entire subnet. The ACL is processed in the same order its listed. If no networks match, the default policy is to deny all except loopback. Valid only for `UseSpecifiedNetworkACL` recursion option.
      # - DNS_SERVER_RECURSION_DENIED_NETWORKS=1.1.1.0/24 #Comma separated list of IP addresses or network addresses to deny recursion. Valid only for `UseSpecifiedNetworkACL` recursion option. This option is obsolete and DNS_SERVER_RECURSION_NETWORK_ACL should be used instead.
      # - DNS_SERVER_RECURSION_ALLOWED_NETWORKS=127.0.0.1, 192.168.1.0/24 #Comma separated list of IP addresses or network addresses to allow recursion. Valid only for `UseSpecifiedNetworkACL` recursion option.  This option is obsolete and DNS_SERVER_RECURSION_NETWORK_ACL should be used instead.
      - DNS_SERVER_ENABLE_BLOCKING=true #Sets the DNS server to block domain names using Blocked Zone and Block List Zone.
      - DNS_SERVER_ALLOW_TXT_BLOCKING_REPORT=true #Specifies if the DNS Server should respond with TXT records containing a blocked domain report for TXT type requests.
      - DNS_SERVER_BLOCK_LIST_URLS=!https://raw.githubusercontent.com/FaserF/adguardhome_lists/master/whitelist,!https://raw.githubusercontent.com/FaserF/adguardhome_lists/master/whitelist_ms_autopilot,https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt,https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt,https://adguardteam.github.io/HostlistsRegistry/assets/filter_24.txt,https://adguardteam.github.io/HostlistsRegistry/assets/filter_38.txt,https://adguardteam.github.io/HostlistsRegistry/assets/filter_49.txt,https://adguardteam.github.io/HostlistsRegistry/assets/filter_51.txt,https://adguardteam.github.io/HostlistsRegistry/assets/filter_48.txt,https://adguardteam.github.io/HostlistsRegistry/assets/filter_34.txt,https://adguardteam.github.io/HostlistsRegistry/assets/filter_27.txt,https://adguardteam.github.io/HostlistsRegistry/assets/filter_5.txt,https://adguardteam.github.io/HostlistsRegistry/assets/filter_4.txt,https://adguardteam.github.io/HostlistsRegistry/assets/filter_3.txt,https://adguardteam.github.io/HostlistsRegistry/assets/filter_33.txt,https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt,https://raw.githubusercontent.com/FaserF/piholeblockinglists/master/other.txt,https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts,https://s3.amazonaws.com/lists.disconnect.me/simple_ad.txt,https://raw.githubusercontent.com/hectorm/hmirror/master/data/adaway.org/list.txt,https://raw.githubusercontent.com/hectorm/hmirror/master/data/adblock-nocoin-list/list.txt,https://raw.githubusercontent.com/hectorm/hmirror/master/data/anudeepnd-adservers/list.txt,https://raw.githubusercontent.com/hectorm/hmirror/master/data/easylist/list.txt,https://raw.githubusercontent.com/hectorm/hmirror/master/data/easyprivacy/list.txt,https://raw.githubusercontent.com/hectorm/hmirror/master/data/eth-phishing-detect/list.txt,https://raw.githubusercontent.com/hectorm/hmirror/master/data/matomo.org-spammers/list.txt,https://adguardteam.github.i