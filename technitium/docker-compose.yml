      - DNS_SERVER_SSO_ENABLED=true
      - DNS_SERVER_SSO_AUTHORITY=${DNS_SERVER_SSO_AUTHORITY}
      - DNS_SERVER_SSO_CLIENT_ID=${DNS_SERVER_SSO_CLIENT_ID}
      - DNS_SERVER_SSO_CLIENT_SECRET=${DNS_SERVER_SSO_CLIENT_SECRET}
      - DNS_SERVER_SSO_METADATA_ADDRESS=${DNS_SERVER_SSO_METADATA_ADDRESS}
      - DNS_SERVER_SSO_SCOPES=${DNS_SERVER_SSO_SCOPES}
      - DNS_SERVER_SSO_ALLOW_SIGNUP=${DNS_SERVER_SSO_ALLOW_SIGNUP}
      - DNS_SERVER_SSO_ALLOW_SIGNUP_ONLY_FOR_MAPPED_USERS=${DNS_SERVER_SSO_ALLOW_SIGNUP_ONLY_FOR_MAPPED_USERS}
      - DNS_SERVER_SSO_GROUP_MAP=${DNS_SERVER_SSO_GROUP_MAP}
      - DNS_SERVER_FORWARDERS=1.1.1.1:853, 1.0.0.1:853, 9.9.9.9:853, 149.112.112.112:853 #Comma separated list of forwarder addresses.
      - DNS_SERVER_FORWARDER_PROTOCOL=tls #Forwarder protocol options: Udp, Tcp, Tls, Https, HttpsJson.
      # - DNS_SERVER_LOG_USING_LOCAL_TIME=true #Enable this option to use local time instead of UTC for logging.
      - DNS_SERVER_LOG_FOLDER_PATH=/var/log/technitium/dns #The folder path on the server where the log files should be saved.
      # - DNS_SERVER_LOG_MAX_LOG_FILE_DAYS=365 #Max number of days to keep the log files. Log files older than the specified number of days will be deleted automatically. Set 0 to disable auto delete.
      # - DNS_SERVER_STATS_ENABLE_IN_MEMORY_STATS=false #This option will enable in-memory stats and only Last Hour data will be available on Dashboard. No stats data will be stored on disk.
      # - DNS_SERVER_STATS_MAX_STAT_FILE_DAYS=365 #Max number of days to keep the dashboard stats. Stat files older than the specified number of days will be deleted automatically. Set 0 to disable auto delete.
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      
      # Web UI
      - traefik.http.services.technitium-web.loadBalancer.server.port=5380
      - traefik.http.routers.technitium-http.service=technitium-web
      - traefik.http.routers.technitium-http.rule=Host(`dns01-ui.pve01.local.example.com`)
      - traefik.http.routers.technitium-http.entrypoints=http
      - traefik.http.routers.technitium-https.service=technitium-web
      - traefik.http.routers.technitium-https.rule=Host(`dns01-ui.pve01.local.example.com`)
      - traefik.http.routers.technitium-https.entrypoints=https
      - traefik.http.routers.technitium-https.tls=true
      - traefik.http.routers.technitium-https.tls.certresolver=cloudflare
    
      # DoH
      - traefik.http.services.technitium-doh.loadBalancer.server.port=80
      - traefik.http.routers.technitium-doh.service=technitium-doh
      - traefik.http.routers.technitium-doh.rule=Host(`dns01-ui.pve01.local.example.com`) && Path(`/dns-query`)
      - traefik.http.routers.technitium-doh.entrypoints=https
      - traefik.http.routers.technitium-doh.tls=true
      - traefik.http.routers.technitium-doh.tls.certresolver=cloudflare
      - traefik.http.routers.technitium-doh.priority=100
    volumes:
      - /etc/dockercompose/technitium/config:/etc/dns
      - /etc/dockercompose/technitium/logs:/var/log/technitium/dns
    restart: unless-stopped
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65535 #remove when using "host" network mode

networks:
  proxy:
    external: true